<!doctype html>
<!-- The console: the conversation, the composer, then a status line. main.js drives it through preload.js. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Fibona</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #20202e; color: #d6d6dd;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; white-space: pre-wrap; word-break: break-word; }
  /* Where the title bar was: room for the window's buttons, and a handle to drag the window by. */
  #titlebar { flex: none; height: 32px; -webkit-app-region: drag; }
  .cell { color: #8fa8ff; }
  .user { background: #41414e; font-weight: bold; }
  .history { opacity: 0.5; }
  textarea { margin: 0 16px; padding: 10px 12px; min-height: 20px; max-height: 160px; resize: none; border: 0;
    border-radius: 8px; background: #41414e; color: inherit; font: inherit; outline: none; }
  textarea:disabled { opacity: 0.6; cursor: default; }
  #status { display: flex; align-items: center; gap: 8px; padding: 6px 20px 10px; color: #a4cea2; font-size: 12px; }
  #state { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #speed { color: #e5c07b; }
  #spinner { width: 10px; height: 10px; border: 2px solid #a4cea2; border-right-color: transparent; border-radius: 50%;
    animation: spin 0.8s linear infinite; }
  #spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="titlebar"></div>
<div id="log"></div>
<textarea id="field" rows="1" placeholder="Fibona is working…" disabled></textarea>
<div id="status"><div id="spinner" hidden></div><span id="state">Starting</span><span id="speed"></span></div>
<script>
  const [log, field, spinner, state, speed] = ["log", "field", "spinner", "state", "speed"].map((id) => document.getElementById(id));

  fibona.on("write", (text, kind) => {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const span = document.createElement("span");
    span.className = kind ?? "";
    span.textContent = text;
    log.append(span);
    if (atBottom) log.scrollTop = log.scrollHeight;
  });
  fibona.on("status", (text, tokens, busy) => {
    state.textContent = text;
    speed.textContent = tokens;
    spinner.hidden = !busy;
  });
  fibona.on("ask", ({ secret: s, fallback }) => {
    field.style.webkitTextSecurity = s ? "disc" : "none";
    field.placeholder = fallback ? `Enter for ${fallback}` : "Message Fibona";
    field.disabled = false;
    field.focus();
  });

  // Enter sends; Shift+Enter adds a line.
  field.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    fibona.send("submit", field.value);
    field.value = "";
    field.style.webkitTextSecurity = "none";
    // Closed until the next ask: a line can be sent only while a cell waits in input().
    field.disabled = true;
    field.placeholder = "Fibona is working…";
    fit();
  });
  const fit = () => {
    field.style.height = "auto";
    field.style.height = field.scrollHeight - 20 + "px";
  };
  field.addEventListener("input", fit);
</script>
</body>
</html>
