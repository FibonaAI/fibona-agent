# Copy this anywhere, edit it, then: make -C eval job CONFIG=<path>. The job archives its own copy.
name: tb2-smoke                 # The run is <UTC time>-<name>: eval/experiments/<run>/ and <archive>/<run>/.
archive: tos://fibona-eval-archive/jobs
dataset: terminal-bench@2.0     # Harbor dataset, as `harbor run -d` takes it.
model: openai/gpt-6-astra       # As `harbor run -m` takes it.
model_settings:                 # call_me defaults and API retries; omit any to keep Fibona's own.
  reasoning_effort: high        # medium, high or xhigh, when the agent doesn't pick one (Fibona: medium).
  max_output_tokens: 32768      # Per call, reasoning included, when the agent doesn't set one.
  api_retries: 8                # OpenAI client retries per call.
settings:
  user: harbor-runner
  pk: ~/.ssh/fibona-harbor-runner   # Private key path on the machine running make.
  port: 22
  # ports: {node2: 2222}        # Override the SSH port for individual hosts.
  registry: fibona-cn-beijing.cr.volces.com/mlp   # Task images are mirrored here before the run.
groups:                         # First matching group wins; put an optional catch-all last.
  - hosts:                      # Fixed hosts, with scheduling budgets after system/sidecar headroom.
      node1: {cpus: 56, memory_mb: 196608}
    tasks: ["fix-*"]            # Task name globs, matched without the registry org prefix.
  - ecs:                        # Workers launched for this job and deleted after it; see steps/workers.py.
      count: 2
      instance_type: ecs.g3a.16xlarge         # 64 vCPU, 256 GiB.
      budget: {cpus: 56, memory_mb: 229376}
      image_id: image-yey3mu3z3b9q7dup24so    # CPU worker image, see build/image.sh.
      zone: cn-beijing-d
      subnet_id: subnet-1c1eimqh9raio5e8j713wiixm
      security_group_ids: [sg-2f801jdyury0w4f4pzzhrpbby, sg-w0ggrhvvutc0865yk9p3w4xb]
      key_pair: fibona-songwei
    tasks: []                   # Empty or omitted: all remaining tasks.
# Per-task CPU/memory/GPU requirements are read from the dataset, including separate verifiers.
# Use extra_args: ["-n", "16"] to add a global trial cap for an API rate limit.
# exclude: ["*-gpu"]            # Task name globs to skip.
limit: 2                        # At most this many tasks; remove for a full run.
# extra_args: ["--timeout-multiplier", "2"]   # Passed to `harbor run` as is.
