# A cluster job: tasks run on ECS workers launched for the job (or on fixed hosts, see groups). For one machine,
# see local.example.yaml. Copy this anywhere, edit it, then: make -C eval job CONFIG=<path>; the job archives a copy.
name: tb2-smoke                 # The run is <UTC time>-<name>: eval/experiments/<run>/ and <archive>/<run>/.
archive: tos://fibona-eval-archive/jobs
dataset: terminal-bench@2.0     # Harbor dataset, as `harbor run -d` takes it.
# agent: my_package.agent:Agent  # Optional Harbor agent name or importable module:Class.
model: openai/gpt-6-astra       # As `harbor run -m` takes it.
# base_url: https://api.example.com/v1  # Optional endpoint; API key stays in the environment.
model_settings:                 # Shared model settings; omitted values use environment/agent defaults.
  reasoning_effort: high        # Reasoning effort; supported values depend on the model and agent.
  max_output_tokens: 32768      # Per call, reasoning included, when the agent doesn't set one.
  api_retries: 8                # OpenAI client retries per call.
  # context_tokens: 1048576     # Input + output budget for agents with a context-window policy.
  # extra_body: {}             # Optional JSON request extensions, interpreted by the model API.
registry: fibona-cn-beijing.cr.volces.com/mlp   # Task images are mirrored here before the run and pulled from here.
# vepfs: mount-f9c28f8d         # ECS workers mount vePFS at /vepfs (adds ~3 min) and /home/users as on MLP dev boxes;
                                # write job data to /home/users/shared. ap-southeast-1: region: ap-southeast-1,
                                # vepfs: mount-e84848a5, no registry.
settings:                       # SSH login to every worker and host.
  user: harbor-runner
  pk: ~/.ssh/fibona-harbor-runner   # Private key path on the machine running make.
  port: 22
  # ports: {node2: 2222}        # Override the SSH port for individual hosts.
groups:                         # First matching group wins; put an optional catch-all last.
  - ecs:                        # Workers launched for this job and deleted after it; see steps/workers.py.
      count: 2
      instance_type: ecs.g3a.16xlarge         # 64 vCPU, 256 GiB.
      budget: {cpus: 56, memory_mb: 229376}   # Scheduling budget per worker, after system/sidecar headroom.
      image_id: image-yeytfwnbf9hli7b4xnye    # CPU worker image, see build/image.sh.
      zone: cn-beijing-d
      subnet_id: subnet-1c1eimqh9raio5e8j713wiixm
      security_group_ids: [sg-2f801jdyury0w4f4pzzhrpbby, sg-w0ggrhvvutc0865yk9p3w4xb]
      key_pair: fibona-songwei
    tasks: []                   # Task name globs, matched without the registry org prefix; empty: all remaining tasks.
  # Fixed hosts instead of (or alongside) ECS: existing machines set up like a worker (build/image.sh), by IP or
  # name, each with its scheduling budget after system/sidecar headroom. Give a group either hosts or ecs.
  # - hosts:
  #     10.42.2.111: {cpus: 56, memory_mb: 196608}
  #     10.42.2.112: {cpus: 56, memory_mb: 196608, gpus: 8}
  #   tasks: ["fix-*"]          # Put groups with specific globs before the catch-all.
# Per-task CPU/memory/GPU requirements are read from the dataset, including separate verifiers.
# Use extra_args: ["-n", "16"] to add a global trial cap for an API rate limit.
# exclude: ["*-gpu"]            # Task name globs to skip.
limit: 2                        # At most this many tasks; remove for a full run.
# extra_args: ["--timeout-multiplier", "2"]   # Passed to `harbor run` as is.
