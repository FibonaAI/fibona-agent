# A local job: tasks run on this machine alone, in its Docker as you, with no SSH or workers.
# For a cluster, see cluster.example.yaml. Copy this anywhere, edit it, then: make -C eval job CONFIG=<path>.
name: tb2-local                 # The run is <UTC time>-<name>: eval/experiments/<run>/ and <archive>/<run>/.
archive: tos://fibona-eval-archive/jobs
dataset: terminal-bench@2.0     # Harbor dataset, as `harbor run -d` takes it.
# agent: my_package.agent:Agent  # Optional Harbor agent name or importable module:Class.
model: openai/gpt-6-astra       # As `harbor run -m` takes it.
# base_url: https://api.example.com/v1  # Optional endpoint; API key stays in the environment.
model_settings:                 # Shared model settings; omitted values use environment/agent defaults.
  reasoning_effort: high        # Reasoning effort; supported values depend on the model and agent.
  max_output_tokens: 32768      # Per call, reasoning included, when the agent doesn't set one.
  api_retries: 8                # OpenAI client retries per call.
  # context_tokens: 1048576     # Input + output budget for agents with a context-window policy.
  # extra_body: {}             # Optional JSON request extensions, interpreted by the model API.
  # price: {input: 10, cached_input: 1, cache_write: 12.5, output: 50}  # USD/1M tokens (gpt-6-astra), see README.
registry: fibona-cn-beijing.cr.volces.com/mlp   # Task images are mirrored here before the run and pulled from here;
                                                # this machine's Docker must be logged in to it (~/.docker/config.json).
local: {cpus: 48, memory_mb: 163840}   # Budget on this machine (gpus optional); leave room for others sharing it.
# Per-task CPU/memory/GPU requirements are read from the dataset, including separate verifiers.
# Use extra_args: ["-n", "16"] to add a global trial cap for an API rate limit.
# exclude: ["*-gpu"]            # Task name globs to skip.
limit: 2                        # At most this many tasks; remove for a full run.
# extra_args: ["--timeout-multiplier", "2"]   # Passed to `harbor run` as is.
