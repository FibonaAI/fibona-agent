exclude: ^demos/.*\.ipynb$
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: uv run python -m unittest discover -s tests -p "*_test.py"
        language: system
        types: [python]
        pass_filenames: false
